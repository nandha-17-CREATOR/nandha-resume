name: Deploy Colouring Wealth to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Static HTML Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy HTML to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html"
          target: "/home/ubuntu/colouring-wealth-deploy/"
          overwrite: true

      - name: Deploy Website and Reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            sudo install -D -m 644 \
              /home/ubuntu/colouring-wealth-deploy/index.html \
              /var/www/colouring-wealth/index.html

            sudo nginx -t

            sudo systemctl reload nginx

            echo "Colouring Wealth deployment successful!"